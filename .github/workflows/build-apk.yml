name: Build WaterRower APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Resolve version metadata
        id: version
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1")
            VERSION_NAME="${LATEST_TAG#v}-dev.${VERSION_CODE}"
          fi
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved versionCode=${VERSION_CODE}, versionName=${VERSION_NAME}"

      - name: Prepare release signing keystore
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/release-signing.jks"
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=${KEYSTORE_PATH}" >> "$GITHUB_OUTPUT"
            echo "Release signing enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured; falling back to debug APK."
          fi

      - name: Run unit tests
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Signed Release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          SIGNING_STORE_FILE: ${{ steps.signing.outputs.keystore_path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Build Debug APK
        if: steps.signing.outputs.enabled != 'true'
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gradle assembleDebug --stacktrace

      - name: Clean up keystore file
        if: always() && steps.signing.outputs.keystore_path != ''
        run: rm -f "${{ steps.signing.outputs.keystore_path }}"

      - name: Upload Signed Release APK artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: waterrower-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Debug APK artifact
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: waterrower-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            APK_NAME="waterrower-tracker-${GITHUB_REF_NAME}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          else
            APK_NAME="waterrower-tracker-${GITHUB_REF_NAME}-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          fi
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" \
            --title "${GITHUB_REF_NAME} — WaterRower" \
            --generate-notes
